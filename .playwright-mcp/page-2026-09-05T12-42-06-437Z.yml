          - heading "Early teams shipping fast." [level=3] [ref=f11e906]
          - paragraph [ref=f11e907]: You're 4 people. You're shipping every week. Nobody has time to write release notes — but every release is a chance to grow. Patchwork turns your velocity into distribution.
